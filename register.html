<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizupon Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/admin-style.css">
</head>
<body>
    
    <header class="bizupon-header">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="container-fluid px-4">
            <div class="d-flex align-items-center justify-content-between">

                <!-- Logo -->
                <a class="logo" href="/index.html">
                    <img src="/images/logo.png" alt="" srcset="">
                </a>

                <!-- User dropdown -->
                <div class="dropdown user-dropdown">
                <button class="btn user-toggle dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="avatar"><i class="bi bi-person-fill"></i></span>
                    <span class="welcome-text">Welcome Bizupon User</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end user-menu">
                    <li><a class="dropdown-item" href="/login.html"><i class="bi bi-power me-2"></i> Login</a></li>
                    <li><a class="dropdown-item" href="/user-login.html"><i class="bi bi-power me-2"></i>User Login</a></li>
                    <li><a class="dropdown-item" href="/register.html"><i class="bi bi-box-arrow-in-right me-2"></i>Register</a></li>
                </ul>
                </div>
            </div>
            </div>
        </div>
    </header>

    <!-- Register Section -->
    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">

            <!-- ===================== LEFT — BRAND PANEL ===================== -->
            <div class="col-lg-6 brand-panel d-none d-lg-flex flex-column justify-content-between">
                <div class="ps-overlay"></div>
            </div>

            <!-- ===================== RIGHT — FORM PANEL ===================== -->
            <div class="col-lg-6 form-panel d-flex align-items-center justify-content-center">
            <div class="form-wrap">

                <!-- mobile-only compact logo -->
                <div class="brand-mark brand-mark-mobile d-lg-none">
                <span class="brand-badge">
                    <svg width="16" height="16" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="20,3 35,14 29,36 11,36 5,14" fill="none" stroke="#0d0d0d" stroke-width="3"/>
                    <polygon points="20,3 35,14 20,20" fill="#0d0d0d" opacity="0.85"/>
                    </svg>
                </span>
                <span class="brand-name">biz<strong>upon</strong></span>
                </div>

                <h2 class="form-title">Register Account</h2>
                <p class="form-subtitle">Join Bizupon today — it's free to get started</p>

                <form novalidate>

                <div class="row g-3">
                    <div class="col-sm-6">
                    <label class="form-label" for="firstName">First Name</label>
                    <input type="text" class="form-control biz-input" id="firstName" placeholder="John">
                    </div>
                    <div class="col-sm-6">
                    <label class="form-label" for="lastName">Last Name</label>
                    <input type="text" class="form-control biz-input" id="lastName" placeholder="Smith">
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-icon-wrap">
                    <input type="email" class="form-control biz-input" id="email" placeholder="you@example.com">
                    <i class="bi bi-envelope"></i>
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-icon-wrap">
                    <input type="password" class="form-control biz-input" id="password" placeholder="Create a password">
                    <i class="bi bi-eye toggle-password" role="button" aria-label="Show password"></i>
                    </div>
                </div>

                <div class="form-check mt-3">
                    <input class="form-check-input" type="checkbox" id="agreeTerms">
                    <label class="form-check-label terms-label" for="agreeTerms">
                    I agree to the <a href="#">Terms &amp; Conditions</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-biz-primary w-100 mt-4">Create Account</button>

                <p class="login-line">Already have an account? <a href="#">Log in</a></p>
                </form>

            </div>
            </div>

        </div>
    </div>

    <script src="/javascript/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
